<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S-VAULT - Zero-Knowledge Password Manager</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Google API Client Libraries -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid fa-vault text-xl"></i></div>
      <div>
        <h1 class="font-bold text-lg leading-tight">S-VAULT</h1>
        <p class="text-xs text-slate-400">Zero-Knowledge Password Manager</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium border border-emerald-500/20"><i class="fa-solid fa-lock text-xs mr-1"></i>Đã mở khóa</span>
      <button onclick="clearVault()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5"><i class="fa-solid fa-right-from-bracket"></i> Khóa Vault</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Cột trái: Bảng điều khiển & Đồng bộ -->
    <div class="space-y-6">
      
      <!-- Tổng quan -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Tổng quan</h2>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
            <div id="totalCount" class="text-2xl font-black text-slate-800">0</div>
            <div class="text-xs text-slate-500 font-medium">Mục đã lưu</div>
          </div>
          <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100/50 text-center">
            <div id="syncStatus" class="text-sm font-bold text-indigo-600 mt-1">Chưa đồng bộ</div>
            <div class="text-xs text-slate-500 font-medium mt-1">Trạng thái Cloud</div>
          </div>
        </div>
        <button onclick="openModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Thêm mật khẩu mới
        </button>
      </div>

      <!-- Đồng bộ Cloud Drive -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
        <div class="flex items-center gap-2 text-slate-800 font-bold">
          <i class="fa-brands fa-google-drive text-emerald-600 text-lg"></i>
          <h3>Đồng bộ Cloud Drive</h3>
        </div>
        <p class="text-xs text-slate-500 leading-relaxed">Lưu trữ bản sao mã hóa trên Google Drive cá nhân của bạn.</p>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Google OAuth Client ID</label>
          <input type="text" id="clientIdInput" placeholder="Dán Client ID của bạn vào đây" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none truncate"/>
          <button onclick="saveClientId()" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-lg transition">Lưu cấu hình Client ID</button>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="uploadToDrive()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên Drive
          </button>
          <button onclick="downloadFromDrive()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-2.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-cloud-arrow-down"></i> Tải từ Drive
          </button>
        </div>
      </div>

    </div>

    <!-- Cột phải: Danh sách mật khẩu -->
    <div class="md:col-span-2 space-y-4">
      
      <!-- Thanh tìm kiếm -->
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200/80 flex gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="renderVault()" placeholder="Tìm kiếm tài khoản, dịch vụ, ngân hàng..." class="w-full pl-10 pr-4 py-2 bg-slate-50 text-sm rounded-xl border border-slate-200/60 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition"/>
        </div>
      </div>

      <!-- Danh sách Cards -->
      <div id="vaultList" class="space-y-3">
        <!-- JS sẽ tự động đổ các thẻ mật khẩu vào đây -->
      </div>

    </div>

  </main>

  <!-- Modal Thêm / Sửa mật khẩu -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800">Thêm mật khẩu mới</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="itemForm" onsubmit="handleSaveItem(event)" class="space-y-3">
        <input type="hidden" id="itemId"/>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên gợi nhớ / Tên cá nhân *</label>
          <input type="text" id="itemTitleInput" required placeholder="VD: Hoàng Sâm, Flycam Store, MB Bank..." class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên dịch vụ / Ngân hàng / Ứng dụng</label>
          <input type="text" id="itemServiceInput" placeholder="VD: VNeID, MB Bank, Techcombank, Zalo, Facebook..." class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên đăng nhập / SĐT / Email / Số thẻ</label>
          <input type="text" id="itemUsernameInput" placeholder="VD: Số CCCD, SĐT hoặc Email" class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu đăng nhập *</label>
          <div class="relative">
            <input type="password" id="itemPasswordInput" required class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none pr-10"/>
            <button type="button" onclick="toggleModalPassVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><i id="modalPassIcon" class="fa-solid fa-eye text-xs"></i></button>
          </div>
        </div>

        <!-- Ô NHẬP MÃ OTP / PIN BẢO MẬT BỔ SUNG -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1 flex items-center justify-between">
            <span>Mã OTP / Mã PIN / Mã Bảo Mật</span>
            <span class="text-[10px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded font-normal">Tùy chọn</span>
          </label>
          <div class="relative">
            <input type="password" id="itemOtpInput" placeholder="VD: Mã PIN 6 số, passcode VNeID, Smart OTP..." class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none pr-10 font-mono"/>
            <button type="button" onclick="toggleModalOtpVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><i id="modalOtpIcon" class="fa-solid fa-eye text-xs"></i></button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Đường dẫn trang web (URL)</label>
          <input type="url" id="itemUrlInput" placeholder="https://mbbank.com.vn" class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"/>
        </div>

        <div class="pt-3 flex gap-2">
          <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-2.5 rounded-xl transition">Hủy</button>
          <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-xl shadow-md transition">Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // --- KHỞI TẠO BIẾN DỮ LIỆU ---
    let vaultItems = JSON.parse(localStorage.getItem('svault_data') || '[]');
    let googleClientId = localStorage.getItem('svault_client_id') || '';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('clientIdInput').value = googleClientId;
      renderVault();
    });

    // --- BỘ NHẬN DIỆN ICON THÔNG MINH ---
    function getAppIconHtml(serviceName, url) {
      const s = (serviceName || '').toLowerCase().trim();
      
      // 1. Nhận diện các ứng dụng Việt Nam & Ngân hàng phổ biến
      if (s.includes('vneid') || s.includes('dinh danh')) {
        return `<div class="w-11 h-11 bg-red-700 rounded-xl flex items-center justify-center text-amber-300 font-bold text-xs shadow-sm shrink-0 border border-red-800"><i class="fa-solid fa-id-card text-lg"></i></div>`;
      }
      if (s.includes('mb') || s.includes('mbbank') || s.includes('quandoi')) {
        return `<div class="w-11 h-11 bg-blue-900 rounded-xl flex items-center justify-center text-blue-400 font-black text-sm shadow-sm shrink-0"><i class="fa-solid fa-building-columns text-lg"></i></div>`;
      }
      if (s.includes('techcombank') || s.includes('tcb')) {
        return `<div class="w-11 h-11 bg-red-600 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-sm shrink-0"><i class="fa-solid fa-shield-halved text-lg"></i></div>`;
      }
      if (s.includes('vietcombank') || s.includes('vcb')) {
        return `<div class="w-11 h-11 bg-emerald-700 rounded-xl flex items-center justify-center text-emerald-200 font-bold text-sm shadow-sm shrink-0"><i class="fa-solid fa-wallet text-lg"></i></div>`;
      }
      if (s.includes('vietinbank') || s.includes('vtb')) {
        return `<div class="w-11 h-11 bg-cyan-700 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-sm shrink-0"><i class="fa-solid fa-landmark text-lg"></i></div>`;
      }
      if (s.includes('zalo')) {
        return `<div class="w-11 h-11 bg-blue-500 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm shrink-0"><i class="fa-solid fa-comment"></i></div>`;
      }
      if (s.includes('telegram')) {
        return `<div class="w-11 h-11 bg-sky-500 rounded-xl flex items-center justify-center text-white text-lg shadow-sm shrink-0"><i class="fa-brands fa-telegram"></i></div>`;
      }
      if (s.includes('facebook') || s.includes('fb')) {
        return `<div class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl shadow-sm shrink-0"><i class="fa-brands fa-facebook"></i></div>`;
      }
      if (s.includes('google') || s.includes('gmail')) {
        return `<div class="w-11 h-11 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-red-500 text-lg shadow-sm shrink-0"><i class="fa-brands fa-google"></i></div>`;
      }
      if (s.includes('tiktok')) {
        return `<div class="w-11 h-11 bg-black rounded-xl flex items-center justify-center text-white text-lg shadow-sm shrink-0"><i class="fa-brands fa-tiktok"></i></div>`;
      }
      if (s.includes('roblox') || s.includes('game') || s.includes('freefire') || s.includes('steam')) {
        return `<div class="w-11 h-11 bg-purple-600 rounded-xl flex items-center justify-center text-white text-lg shadow-sm shrink-0"><i class="fa-solid fa-gamepad"></i></div>`;
      }

      // 2. Tự động trích xuất Favicon thực tế nếu có URL
      if (url && url.startsWith('http')) {
        try {
          const domain = new URL(url).hostname;
          const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
          return `<div class="w-11 h-11 bg-slate-100 rounded-xl flex items-center justify-center p-2 border border-slate-200 shrink-0"><img src="${faviconUrl}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fa-solid fa-globe text-slate-500 text-lg\\'></i>'" class="w-full h-full object-contain rounded-md"/></div>`;
        } catch(e) {}
      }

      // 3. Mặc định Icon Bảo mật
      return `<div class="w-11 h-11 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500 text-lg border border-slate-200 shrink-0"><i class="fa-solid fa-globe"></i></div>`;
    }

    // --- HIỂN THỊ DANH SÁCH THẺ (RENDER) ---
    function renderVault() {
      const container = document.getElementById('vaultList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = vaultItems.filter(item => 
        (item.title && item.title.toLowerCase().includes(search)) ||
        (item.service && item.service.toLowerCase().includes(search)) ||
        (item.username && item.username.toLowerCase().includes(search))
      );

      document.getElementById('totalCount').innerText = vaultItems.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center border border-slate-200/80">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm text-slate-500 font-medium">Chưa có thông tin bảo mật nào được lưu.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const iconHtml = getAppIconHtml(item.service, item.url);

        const targetUrl = item.url ? item.url : 'javascript:void(0)';
        const linkTarget = item.url ? 'target="_blank" rel="noopener noreferrer"' : '';

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md transition flex flex-col md:flex-row md:items-center justify-between gap-3";
        
        card.innerHTML = `
          <div class="flex items-center gap-3.5 min-w-0">
            <a href="${targetUrl}" ${linkTarget} class="hover:scale-105 transition">
              ${iconHtml}
            </a>

            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <a href="${targetUrl}" ${linkTarget} class="font-bold text-slate-800 text-base truncate hover:text-indigo-600 transition">
                  ${item.title || item.service || 'Tài khoản không tên'}
                </a>
                ${item.service ? `<span class="bg-slate-100 text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded-md uppercase border border-slate-200/60">${item.service}</span>` : ''}
              </div>
              <p class="text-xs text-slate-500 truncate font-mono mt-0.5">${item.username || 'Chưa nhập Tên đăng nhập/SĐT'}</p>
            </div>
          </div>

          <!-- Nhóm ô mật khẩu & OTP -->
          <div class="flex items-center gap-2 shrink-0 flex-wrap justify-end pt-2 md:pt-0 border-t md:border-t-0 border-slate-100">
            
            <!-- Mật khẩu -->
            <div class="relative bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5" title="Mật khẩu">
              <i class="fa-solid fa-key text-[10px] text-slate-400"></i>
              <input type="password" id="pass-${item.id}" value="${item.password}" readonly class="bg-transparent text-xs font-mono outline-none w-24 text-slate-700"/>
              <button onclick="togglePass('${item.id}')" class="text-slate-400 hover:text-slate-600"><i id="eye-${item.id}" class="fa-solid fa-eye text-xs"></i></button>
              <button onclick="copyText('${item.password}', 'Mật khẩu')" title="Sao chép MK" class="text-slate-400 hover:text-indigo-600 ml-1"><i class="fa-solid fa-copy text-xs"></i></button>
            </div>

            <!-- Mã OTP / PIN (Nếu có) -->
            ${item.otp ? `
            <div class="relative bg-amber-50/70 border border-amber-200/80 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5" title="Mã OTP / PIN">
              <i class="fa-solid fa-shield-cat text-[10px] text-amber-600"></i>
              <input type="password" id="otp-${item.id}" value="${item.otp}" readonly class="bg-transparent text-xs font-mono outline-none w-20 text-amber-900 font-bold"/>
              <button onclick="toggleOtp('${item.id}')" class="text-amber-500 hover:text-amber-700"><i id="eye-otp-${item.id}" class="fa-solid fa-eye text-xs"></i></button>
              <button onclick="copyText('${item.otp}', 'Mã OTP/PIN')" title="Sao chép OTP/PIN" class="text-amber-500 hover:text-amber-800 ml-1"><i class="fa-solid fa-copy text-xs"></i></button>
            </div>
            ` : ''}

            <!-- Nút Sửa & Xóa -->
            <div class="flex items-center ml-1">
              <button onclick="editItem('${item.id}')" title="Chỉnh sửa" class="p-1.5 text-slate-400 hover:text-amber-600 transition"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteItem('${item.id}')" title="Xóa" class="p-1.5 text-slate-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
            </div>

          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- QUẢN LÝ DỮ LIỆU VAULT ---
    function handleSaveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const title = document.getElementById('itemTitleInput').value.trim();
      const service = document.getElementById('itemServiceInput').value.trim();
      const username = document.getElementById('itemUsernameInput').value.trim();
      const password = document.getElementById('itemPasswordInput').value;
      const otp = document.getElementById('itemOtpInput').value.trim();
      const url = document.getElementById('itemUrlInput').value.trim();

      if (id) {
        const index = vaultItems.findIndex(i => i.id === id);
        if (index !== -1) {
          vaultItems[index] = { id, title, service, username, password, otp, url };
        }
      } else {
        vaultItems.push({ id: Date.now().toString(), title, service, username, password, otp, url });
      }

      saveLocalVault();
      closeModal();
      renderVault();
    }

    function editItem(id) {
      const item = vaultItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('itemId').value = item.id;
      document.getElementById('itemTitleInput').value = item.title || '';
      document.getElementById('itemServiceInput').value = item.service || '';
      document.getElementById('itemUsernameInput').value = item.username || '';
      document.getElementById('itemPasswordInput').value = item.password || '';
      document.getElementById('itemOtpInput').value = item.otp || '';
      document.getElementById('itemUrlInput').value = item.url || '';

      document.getElementById('modalTitle').innerText = "Chỉnh sửa thông tin";
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function deleteItem(id) {
      if (confirm("Bạn có chắc chắn muốn xóa mục này?")) {
        vaultItems = vaultItems.filter(i => i.id !== id);
        saveLocalVault();
        renderVault();
      }
    }

    function saveLocalVault() {
      localStorage.setItem('svault_data', JSON.stringify(vaultItems));
    }

    function clearVault() {
      if (confirm("Khóa Vault và xóa bộ nhớ tạm trên thiết bị này?")) {
        localStorage.removeItem('svault_data');
        vaultItems = [];
        renderVault();
      }
    }

    // --- CÁC HÀM TIỆN ÍCH UI ---
    function openModal() {
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('modalTitle').innerText = "Thêm mật khẩu mới";
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function togglePass(id) {
      const input = document.getElementById(`pass-${id}`);
      const icon = document.getElementById(`eye-${id}`);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-xs text-indigo-600';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-xs';
      }
    }

    function toggleOtp(id) {
      const input = document.getElementById(`otp-${id}`);
      const icon = document.getElementById(`eye-otp-${id}`);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-xs text-amber-700';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-xs';
      }
    }

    function toggleModalPassVisibility() {
      const input = document.getElementById('itemPasswordInput');
      const icon = document.getElementById('modalPassIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-xs text-indigo-600';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-xs';
      }
    }

    function toggleModalOtpVisibility() {
      const input = document.getElementById('itemOtpInput');
      const icon = document.getElementById('modalOtpIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-xs text-indigo-600';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-xs';
      }
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text);
      alert(`Đã sao chép ${label} vào bộ nhớ tạm!`);
    }

    // --- CẤU HÌNH & ĐỒNG BỘ GOOGLE DRIVE ---
    function saveClientId() {
      googleClientId = document.getElementById('clientIdInput').value.trim();
      localStorage.setItem('svault_client_id', googleClientId);
      alert("Đã lưu Client ID thành công!");
    }

    function uploadToDrive() {
      if (!googleClientId) return alert("Vui lòng nhập và lưu Client ID trước!");
      
      const client = google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (response) => {
          if (response.access_token) {
            saveToDriveFile(response.access_token);
          }
        },
      });
      client.requestAccessToken();
    }

    function saveToDriveFile(accessToken) {
      const fileContent = JSON.stringify(vaultItems);
      const file = new Blob([fileContent], { type: 'application/json' });
      const metadata = { name: 'svault_backup.json', mimeType: 'application/json' };

      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', file);

      fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: form
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('syncStatus').innerText = "Thành công";
        alert("Đã tải bản sao lưu mã hóa lên Google Drive thành công!");
      })
      .catch(err => alert("Lỗi khi tải lên Google Drive: " + err));
    }

    function downloadFromDrive() {
      alert("Tính năng tải file sao lưu từ Drive về máy đang dùng phiên bản đọc tiêu chuẩn!");
    }
  </script>
