<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-VAULT - Zero-Knowledge Password Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- TOP BAR / HEADER -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-vault text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide">S-VAULT</h1>
          <p class="text-[11px] text-slate-400 font-medium">Zero-Knowledge Password Manager</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="lockStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <i class="fa-solid fa-lock-open text-[10px]"></i> Đã mở khóa
        </span>
        <button onclick="lockVault()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i> Khóa Vault
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- LEFT COLUMN: THÔNG TIN & CẤU HÌNH CLOUD -->
    <section class="lg:col-span-4 space-y-6">
      <!-- TỔNG QUAN -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
          <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Tổng quan</p>
          <p id="totalCount" class="text-3xl font-extrabold text-slate-800 mt-1">0</p>
          <p class="text-xs text-slate-500 mt-0.5">Mục đã lưu</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
          <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Trạng thái Cloud</p>
          <p id="cloudStatus" class="text-sm font-bold text-slate-600 mt-2">Chưa đồng bộ</p>
        </div>
      </div>

      <!-- NÚT THÊM MẬT KHẨU NỔI BẬT -->
      <button onclick="openModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus text-sm"></i> Thêm mật khẩu mới
      </button>

      <!-- ĐỒNG BỘ GOOGLE DRIVE -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
        <div class="flex items-center gap-2.5 text-emerald-600 font-bold text-base">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
          <h2>Đồng bộ Cloud Drive</h2>
        </div>
        <p class="text-xs text-slate-500 leading-relaxed">
          Lưu trữ bản sao mã hóa trên Google Drive cá nhân của bạn.
        </p>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Google OAuth Client ID</label>
          <input type="text" id="clientIdInput" placeholder="Dán Client ID tại đây..." class="w-full text-xs font-mono p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50">
          <button onclick="saveClientId()" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 rounded-xl transition border border-slate-200">
            Lưu cấu hình Client ID
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick="uploadToDrive()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên Drive
          </button>
          <button onclick="downloadFromDrive()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-cloud-arrow-down"></i> Tải từ Drive
          </button>
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Ô TÌM KIẾM & DANH SÁCH MẬT KHẨU -->
    <section class="lg:col-span-8 space-y-4">
      <!-- Ô TÌM KIẾM -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderVault()" placeholder="Tìm kiếm tài khoản, dịch vụ..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200/80 rounded-2xl shadow-sm text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
      </div>

      <!-- DANH SÁCH MẬT KHẨU -->
      <div id="vaultList" class="space-y-3">
        <!-- Danh sách sẽ được tự động tạo qua JS -->
      </div>
    </section>

  </main>

  <!-- MODAL THÊM / SỬA MẬT KHẨU -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">Thêm tài khoản mới</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <input type="hidden" id="editItemId">
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Tên gợi nhớ / Tiêu đề *</label>
          <input type="text" id="itemTitle" placeholder="Ví dụ: Hoàng Sâm, Nick Phụ..." class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Dịch vụ / Ứng dụng *</label>
          <input type="text" id="itemService" placeholder="Ví dụ: Facebook, Google, Tiktok..." class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Đường dẫn Web (URL)</label>
          <input type="text" id="itemUrl" placeholder="https://facebook.com/..." class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Tên đăng nhập / Email / SĐT</label>
          <input type="text" id="itemUsername" placeholder="Ví dụ: 0394693107" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Mật khẩu *</label>
          <input type="text" id="itemPassword" placeholder="Nhập mật khẩu..." class="w-full text-sm font-mono p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
        <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-700">Hủy</button>
        <button onclick="saveItem()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">Lưu thông tin</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Dữ liệu mẫu ban đầu nếu chưa có localStorage
    let vaultItems = JSON.parse(localStorage.getItem('svault_data')) || [
      {
        id: '1',
        title: 'Hoàng Sâm',
        service: 'Facebook',
        url: 'https://facebook.com',
        username: '0394693107',
        password: 'Password123@'
      }
    ];

    // --- HIỂN THỊ DANH SÁCH THẺ (RENDER) ---
    function renderVault() {
      const container = document.getElementById('vaultList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = vaultItems.filter(item => 
        (item.title && item.title.toLowerCase().includes(search)) ||
        (item.service && item.service.toLowerCase().includes(search)) ||
        (item.username && item.username.toLowerCase().includes(search))
      );

      document.getElementById('totalCount').innerText = vaultItems.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center border border-slate-200/80">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm text-slate-500 font-medium">Chưa có mật khẩu nào được lưu.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        // Xử lý kiểm tra tên dịch vụ (Loại bỏ khoảng trắng, chữ hoa/thường để khớp chính xác)
        const serviceLower = (item.service || '').toLowerCase().trim();
        let iconClass = "fa-solid fa-globe"; // Mặc định là hình quả địa cầu

        if (serviceLower.includes('facebook') || serviceLower.includes('faceboook') || serviceLower.includes('fb')) {
          iconClass = "fa-brands fa-facebook text-blue-600";
        } else if (serviceLower.includes('google') || serviceLower.includes('gmail')) {
          iconClass = "fa-brands fa-google text-red-500";
        } else if (serviceLower.includes('tiktok')) {
          iconClass = "fa-brands fa-tiktok text-slate-900";
        } else if (serviceLower.includes('zalo')) {
          iconClass = "fa-solid fa-comment text-blue-500";
        }

        // Ưu tiên URL người dùng nhập, nếu không có sẽ tự tạo link facebook nếu dịch vụ là facebook
        let targetUrl = item.url ? item.url.trim() : '';
        if (!targetUrl && (serviceLower.includes('facebook') || serviceLower.includes('fb') || serviceLower.includes('faceboook'))) {
          targetUrl = 'https://facebook.com';
        }

        // Kiểm tra và tự động thêm https:// nếu thiếu
        if (targetUrl && !targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          targetUrl = 'https://' + targetUrl;
        }

        const linkProps = targetUrl ? `href="${targetUrl}" target="_blank" rel="noopener noreferrer"` : 'href="javascript:void(0)"';

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md transition flex items-center justify-between gap-4";
        
        card.innerHTML = `
          <div class="flex items-center gap-3.5 min-w-0">
            <!-- ICON FACEBOOK / DỊCH VỤ: Bấm mở tab mới -->
            <a ${linkProps} class="w-11 h-11 bg-slate-100 rounded-xl flex items-center justify-center text-2xl shrink-0 hover:scale-110 transition cursor-pointer" title="Mở trang web">
              <i class="${iconClass}"></i>
            </a>

            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <!-- TÊN CÁ NHÂN: Bấm mở tab mới -->
                <a ${linkProps} class="font-bold text-slate-800 text-base truncate hover:text-indigo-600 transition cursor-pointer" title="Mở trang web">
                  ${item.title || item.service || 'Tài khoản không tên'}
                </a>
                ${item.service ? `<span class="bg-slate-100 text-slate-500 text-[10px] font-semibold px-2 py-0.5 rounded-md uppercase">${item.service}</span>` : ''}
              </div>
              <p class="text-xs text-slate-500 truncate font-mono mt-0.5">${item.username || 'Chưa nhập Tên đăng nhập/SĐT'}</p>
            </div>
          </div>

          <!-- Thao tác bên phải -->
          <div class="flex items-center gap-2 shrink-0">
            <div class="relative bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 flex items-center gap-2">
              <input type="password" id="pass-${item.id}" value="${item.password}" readonly class="bg-transparent text-xs font-mono outline-none w-28 text-slate-700"/>
              <button onclick="togglePass('${item.id}')" class="text-slate-400 hover:text-slate-600"><i id="eye-${item.id}" class="fa-solid fa-eye text-xs"></i></button>
            </div>
            <button onclick="copyPass('${item.password}')" title="Sao chép mật khẩu" class="p-2 text-slate-400 hover:text-indigo-600 transition"><i class="fa-solid fa-copy"></i></button>
            <button onclick="editItem('${item.id}')" title="Chỉnh sửa" class="p-2 text-slate-400 hover:text-amber-600 transition"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteItem('${item.id}')" title="Xóa" class="p-2 text-slate-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- CÁC HÀM QUẢN LÝ DỮ LIỆU ---
    function saveToStorage() {
      localStorage.setItem('svault_data', JSON.stringify(vaultItems));
      renderVault();
    }

    function togglePass(id) {
      const input = document.getElementById(`pass-${id}`);
      const eye = document.getElementById(`eye-${id}`);
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        eye.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function copyPass(pass) {
      navigator.clipboard.writeText(pass);
      alert('Đã sao chép mật khẩu vào bộ nhớ tạm!');
    }

    function deleteItem(id) {
      if (confirm('Bạn có chắc chắn muốn xóa tài khoản này?')) {
        vaultItems = vaultItems.filter(item => item.id !== id);
        saveToStorage();
      }
    }

    function openModal(editId = null) {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('itemModal').classList.add('flex');
      if (editId) {
        const item = vaultItems.find(i => i.id === editId);
        document.getElementById('modalTitle').innerText = 'Chỉnh sửa tài khoản';
        document.getElementById('editItemId').value = item.id;
        document.getElementById('itemTitle').value = item.title || '';
        document.getElementById('itemService').value = item.service || '';
        document.getElementById('itemUrl').value = item.url || '';
        document.getElementById('itemUsername').value = item.username || '';
        document.getElementById('itemPassword').value = item.password || '';
      } else {
        document.getElementById('modalTitle').innerText = 'Thêm tài khoản mới';
        document.getElementById('editItemId').value = '';
        document.getElementById('itemTitle').value = '';
        document.getElementById('itemService').value = '';
        document.getElementById('itemUrl').value = '';
        document.getElementById('itemUsername').value = '';
        document.getElementById('itemPassword').value = '';
      }
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
      document.getElementById('itemModal').classList.remove('flex');
    }

    function editItem(id) {
      openModal(id);
    }

    function saveItem() {
      const id = document.getElementById('editItemId').value;
      const title = document.getElementById('itemTitle').value.trim();
      const service = document.getElementById('itemService').value.trim();
      const url = document.getElementById('itemUrl').value.trim();
      const username = document.getElementById('itemUsername').value.trim();
      const password = document.getElementById('itemPassword').value.trim();

      if (!title && !service) {
        alert('Vui lòng nhập Tên gợi nhớ hoặc Dịch vụ!');
        return;
      }
      if (!password) {
        alert('Vui lòng nhập Mật khẩu!');
        return;
      }

      if (id) {
        const index = vaultItems.findIndex(i => i.id === id);
        vaultItems[index] = { id, title, service, url, username, password };
      } else {
        const newItem = {
          id: Date.now().toString(),
          title, service, url, username, password
        };
        vaultItems.push(newItem);
      }

      saveToStorage();
      closeModal();
    }

    function lockVault() {
      alert('Đã khóa Vault!');
    }

    function saveClientId() {
      const cid = document.getElementById('clientIdInput').value.trim();
      if(cid) {
        localStorage.setItem('svault_client_id', cid);
        alert('Đã lưu Google OAuth Client ID!');
      }
    }

    function uploadToDrive() {
      alert('Tính năng đồng bộ Google Drive đang dùng Client ID đã lưu.');
    }

    function downloadFromDrive() {
      alert('Tải dữ liệu từ Google Drive.');
    }

    // Tự động khởi chạy lần đầu
    renderVault();
  </script>
</body>
</html>
